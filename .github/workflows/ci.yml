name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported version (see CONTRIBUTING.md) and a current one.
        python: ["3.10", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install PyYAML for strict frontmatter parsing
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate SKILL.md, structure, and Markdown links
        run: python scripts/validate_skill.py

      - name: Unit tests for scripts
        run: python -m unittest discover -s tests -v

      - name: Example regression tests (Python and JavaScript)
        run: python scripts/run_examples.py --require-node

      - name: Build and verify release archive
        run: python scripts/build_release.py --version 0.0.0 --out dist-ci

  validate-windows:
    name: Validate on Windows (no PyYAML)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/validate_skill.py
      - run: python -m unittest discover -s tests -v
