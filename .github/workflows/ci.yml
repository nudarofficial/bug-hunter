name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install PyYAML for strict frontmatter parsing
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate SKILL.md, structure, and Markdown links
        run: python scripts/validate_skill.py

      - name: Unit tests for scripts
        run: python -m unittest discover -s tests -v

      - name: Example regression tests (Python and JavaScript)
        run: python scripts/run_examples.py --require-node

      - name: Build and verify release archive
        run: python scripts/build_release.py --version 0.0.0 --out dist-ci

  validate-windows:
    name: Validate on Windows (no PyYAML)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_skill.py
      - run: python -m unittest discover -s tests -v
